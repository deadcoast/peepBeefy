[project]
name = "milky-games"
version = "0.0.4"
description = "Background process checker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mypy>=1.19.1",
    "psutil>=7.2.2",
    "rich>=14.3.3",
    "typer>=0.24.0",
    "types-psutil>=7.2.2.20260130",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
markers = [
    "property_test: marks tests as property-based tests (deselect with '-m \"not property_test\"')",
]
